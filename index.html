<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Market Ticker</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: #090909;
  overflow: hidden;
}

.market-ticker {
  width: 100%;
  height: 80px;
  display: flex;
  align-items: center;
  background: #090909;
  border-top: 1px solid #242424;
  border-bottom: 1px solid #242424;
  font-family: Arial, Helvetica, sans-serif;
}

/* LEFT MARKET BADGE */

.market-badge {
  flex: 0 0 72px;
  height: 50px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 6px;

  background: #111111;
  color: #ffffff;

  font-size: 10px;
  font-weight: 800;
  letter-spacing: .5px;

  border-right: 1px solid #292929;

  position: relative;
  z-index: 10;
}

/* RED DOT */

.market-dot {
  width: 7px;
  height: 7px;

  flex: 0 0 7px;

  border-radius: 50%;

  background: #ff3030;

  box-shadow:
    0 0 8px rgba(255,48,48,.9);

  animation: marketPulse 1.4s infinite;
}

@keyframes marketPulse {

  0%,
  100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }

}

/* TRADINGVIEW AREA */

.market-widget {
  flex: 1 1 auto;

  width: 0;

  height: 50px;

  overflow: hidden;

  position: relative;
}

/*
 IMPORTANT:
 TradingView Ticker Tape needs enough
 vertical space to render correctly.
*/

.market-widget .tradingview-widget-container {

  width: 100% !important;

  height: 50px !important;

  margin: 0 !important;

  padding: 0 !important;

}

.market-widget
.tradingview-widget-container__widget {

  width: 100% !important;

  height: 50px !important;

}

/* MOBILE */

@media (max-width: 600px) {

  .market-ticker {
    height: 46px;
  }

  .market-badge {

    flex-basis: 62px;

    height: 46px;

    font-size: 9px;

  }

  .market-widget {

    height: 46px;

  }

  .market-widget
  .tradingview-widget-container {

    height: 46px !important;

  }

  .market-widget
  .tradingview-widget-container__widget {

    height: 46px !important;

  }

}

</style>

</head>


<body>

<div class="market-ticker">

  <!-- MARKET BADGE -->

  <div class="market-badge">

    <span class="market-dot"></span>

    <span>MARKET</span>

  </div>


  <!-- TRADINGVIEW -->

  <div class="market-widget">

    <div
      class="tradingview-widget-container">

      <div
        class="tradingview-widget-container__widget">
      </div>


      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
        async>

      {
        "symbols": [

          {
            "proName": "NSE:NIFTY",
            "title": "NIFTY 50"
          },

          {
            "proName": "BSE:SENSEX",
            "title": "SENSEX"
          },

          {
            "proName": "NSE:BANKNIFTY",
            "title": "BANK NIFTY"
          },

          {
            "proName": "FX_IDC:USDINR",
            "title": "USD / INR"
          },

          {
            "proName": "TVC:GOLD",
            "title": "GOLD"
          },

          {
            "proName": "TVC:SILVER",
            "title": "SILVER"
          },

          {
            "proName": "TVC:USOIL",
            "title": "CRUDE OIL"
          },

          {
            "proName": "BITSTAMP:BTCUSD",
            "title": "BITCOIN"
          }

        ],

        "showSymbolLogo": false,

        "isTransparent": true,

        "displayMode": "regular",

        "colorTheme": "dark",

        "locale": "en"

      }

      </script>

    </div>

  </div>

</div>

</body>
</html>
