<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market Ticker</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090909;
}

.market{
  width:100%;
  height:44px;
  display:flex;
  align-items:center;
  background:#090909;
  border-top:1px solid #242424;
  border-bottom:1px solid #242424;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

.badge{
  height:100%;
  min-width:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:#111;
  color:#fff;
  font-size:10px;
  font-weight:800;
  letter-spacing:.6px;
  border-right:1px solid #292929;
  box-sizing:border-box;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff3030;
  box-shadow:0 0 7px rgba(255,48,48,.85);
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

.ticker{
  flex:1;
  height:100%;
  min-width:0;
  overflow:hidden;
}

.tradingview-widget-container{
  width:100%;
  height:100%;
}

@media(max-width:600px){

  .market{
    height:39px;
  }

  .badge{
    min-width:60px;
    font-size:9px;
  }

  .dot{
    width:6px;
    height:6px;
  }
}
</style>
</head>

<body>

<div class="market">

  <div class="badge">
    <span class="dot"></span>
    <span>MARKET</span>
  </div>

  <div class="ticker">

    <div
      class="tradingview-widget-container"
      style="height:100%;width:100%;">

      <div
        class="tradingview-widget-container__widget">
      </div>

      <div
        style="
          font-size:0;
          height:0;
          overflow:hidden;
        ">
      </div>

    </div>

  </div>

</div>


<script
  type="text/javascript"
  src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
  async>

{
  "symbols": [

    {
      "proName":"NSE:NIFTY",
      "title":"NIFTY 50"
    },

    {
      "proName":"BSE:SENSEX",
      "title":"SENSEX"
    },

    {
      "proName":"NSE:BANKNIFTY",
      "title":"BANK NIFTY"
    },

    {
      "proName":"FX_IDC:USDINR",
      "title":"USD / INR"
    },

    {
      "proName":"TVC:GOLD",
      "title":"GOLD"
    },

    {
      "proName":"TVC:SILVER",
      "title":"SILVER"
    },

    {
      "proName":"TVC:USOIL",
      "title":"CRUDE OIL"
    },

    {
      "proName":"BITSTAMP:BTCUSD",
      "title":"BITCOIN"
    }

  ],

  "showSymbolLogo":false,
  "isTransparent":true,
  "displayMode":"adaptive",
  "colorTheme":"dark",
  "locale":"en"
}

</script>

</body>
</html>
