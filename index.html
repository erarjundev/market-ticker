<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Market Ticker</title>

<style>
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #090909;
  overflow: hidden;
}

.market-ticker {
  width: 100%;
  height: 44px;
  display: flex;
  align-items: center;
  background: #090909;
  border-top: 1px solid #242424;
  border-bottom: 1px solid #242424;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

.live-badge {
  height: 100%;
  min-width: 70px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #111111;
  color: #ffffff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .6px;
  border-right: 1px solid #292929;
  box-sizing: border-box;
  position: relative;
  z-index: 5;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff3030;
  box-shadow: 0 0 7px rgba(255,48,48,.85);
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

.ticker-area {
  flex: 1;
  height: 100%;
  min-width: 0;
  overflow: hidden;
}

.tradingview-widget-container {
  width: 100%;
  height: 100%;
}

.tradingview-widget-container__widget {
  width: 100%;
  height: 100%;
}

@media(max-width:600px) {

  .market-ticker {
    height: 39px;
  }

  .live-badge {
    min-width: 60px;
    padding: 0 7px;
    font-size: 9px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
  }
}
</style>

</head>

<body>

<div class="market-ticker">

  <div class="live-badge">
    <span class="live-dot"></span>
    <span>MARKET</span>
  </div>

  <div class="ticker-area">

    <div class="tradingview-widget-container">

      <div class="tradingview-widget-container__widget"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
        async>
        {
          "symbols": [
            {
              "proName": "NSE:NIFTY",
              "title": "NIFTY 50"
            },
            {
              "proName": "BSE:SENSEX",
              "title": "SENSEX"
            },
            {
              "proName": "NSE:BANKNIFTY",
              "title": "BANK NIFTY"
            },
            {
              "proName": "FX_IDC:USDINR",
              "title": "USD / INR"
            },
            {
              "proName": "TVC:GOLD",
              "title": "GOLD"
            },
            {
              "proName": "TVC:SILVER",
              "title": "SILVER"
            },
            {
              "proName": "TVC:USOIL",
              "title": "CRUDE OIL"
            },
            {
              "proName": "BITSTAMP:BTCUSD",
              "title": "BITCOIN"
            }
          ],

          "showSymbolLogo": false,
          "isTransparent": true,
          "displayMode": "adaptive",
          "colorTheme": "dark",
          "locale": "en"
        }
      </script>

    </div>

  </div>

</div>

</body>
</html>
